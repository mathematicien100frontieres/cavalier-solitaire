<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Cavalier Solitaire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a single centered column — title, status line, an 8x8 board whose
     edge squares carry their own rank/file labels, controls, and a collapsible
     move list. A deliberately dark "midnight study" palette: the board stays
     quiet so the gold trail left by the knight is the only thing that moves. */
  :root{
    --bg:#0b0c10;
    --panel:#121319;
    --sq-light:#dddbd4;
    --sq-dark:#38373a;
    --fg:#ece9e2;
    --fg-dim:#8d8c96;
    --accent:#4f8fe6;
    --accent-rgb:79,143,230;
    --warn-rgb:209,113,90;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }

  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
  }

  .page{
    max-width:440px;
    margin-inline:auto;
    display:flex;
    flex-direction:column;
    gap:18px;
    padding-block:28px 40px;
  }

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  h1{
    font-family:'Fraunces',Georgia,'Times New Roman',serif;
    font-weight:600;
    font-size:clamp(1.4rem,6vw,1.8rem);
    line-height:1.1;
    letter-spacing:-0.01em;
    margin:0;
    text-wrap:balance;
  }
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:0.85rem;
    color:var(--accent);
    background:rgba(var(--accent-rgb),0.12);
    border:1px solid rgba(var(--accent-rgb),0.3);
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
    flex:none;
  }

  .status{
    margin:0;
    font-size:0.92rem;
    color:var(--fg-dim);
    min-height:1.3em;
    transition:color .2s ease;
  }
  .status.won{ color:var(--accent); }
  .status.stuck{ color:rgb(var(--warn-rgb)); }

  .board-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1;
    border-radius:16px;
    background:var(--panel);
  }
  .board-wrap.won{ animation:winPulse 1.8s ease-in-out infinite; }
  @keyframes winPulse{
    0%,100%{ box-shadow:0 0 0 rgba(var(--accent-rgb),0); }
    50%{ box-shadow:0 0 36px rgba(var(--accent-rgb),.35); }
  }
  @media (prefers-reduced-motion:reduce){
    .board-wrap.won{ animation:none; box-shadow:0 0 28px rgba(var(--accent-rgb),.25); }
  }

  .board{
    position:absolute;
    inset:8px;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    gap:3px;
  }

  .knight{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:min(7.5vw,30px);
    color:var(--accent);
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
    transition:left .22s cubic-bezier(.4,0,.2,1), top .22s cubic-bezier(.4,0,.2,1), transform .22s ease;
    pointer-events:none;
    opacity:0;
    z-index:5;
  }
  .knight.placed{ opacity:1; }
  .knight.landed{ transform:scale(1.15); }

  .sq{
    position:relative;
    border-radius:6px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    touch-action:manipulation;
    transition:background-color .2s ease, box-shadow .2s ease;
  }
  .sq.light{ background:var(--sq-light); }
  .sq.dark{ background:var(--sq-dark); }
  .sq:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .sq.legal{ box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.35); }
  .sq.legal::after{
    content:"";
    position:absolute;
    inset:0;
    margin:auto;
    width:22%;
    height:22%;
    border-radius:50%;
    background:rgba(var(--accent-rgb),.5);
  }
  .sq.current{ box-shadow:inset 0 0 0 2px var(--accent); }
  .sq.invalid{ animation:shake .3s ease; }
  @keyframes shake{
    10%,90%{ transform:translateX(-2px); }
    20%,80%{ transform:translateX(3px); }
    30%,50%,70%{ transform:translateX(-4px); }
    40%,60%{ transform:translateX(4px); }
  }
  @media (prefers-reduced-motion:reduce){
    .sq.invalid{ animation:none; box-shadow:inset 0 0 0 2px rgba(var(--warn-rgb),.7); }
  }

  .sq .order{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    color:var(--fg);
    text-shadow:0 1px 3px rgba(0,0,0,.7);
    opacity:.85;
    pointer-events:none;
  }
  .sq .rank, .sq .file{
    position:absolute;
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    color:var(--fg-dim);
    opacity:.55;
    pointer-events:none;
  }
  .sq .rank{ top:3px; left:4px; }
  .sq .file{ bottom:2px; right:4px; }

  .controls{ display:flex; gap:10px; }
  button.action{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.1);
    background:var(--panel);
    color:var(--fg);
    font:500 0.9rem 'IBM Plex Sans',sans-serif;
    cursor:pointer;
    transition:border-color .15s ease, opacity .15s ease;
  }
  button.action:hover{ border-color:rgba(var(--accent-rgb),.4); }
  button.action:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  button.action:disabled{ opacity:.4; cursor:default; }
  button.action.primary{
    background:rgba(var(--accent-rgb),.14);
    border-color:rgba(var(--accent-rgb),.4);
    color:var(--accent);
  }
  button.action svg{ width:16px; height:16px; flex:none; }

  details.path{
    border-top:1px solid rgba(255,255,255,.08);
    padding-top:12px;
  }
  details.path summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:0.85rem;
    color:var(--fg-dim);
    -webkit-tap-highlight-color:transparent;
  }
  details.path summary::-webkit-details-marker{ display:none; }
  details.path summary .chev{ transition:transform .2s ease; flex:none; }
  details.path[open] summary .chev{ transform:rotate(90deg); }
  .path-list{
    margin-top:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.82rem;
    color:var(--fg-dim);
    line-height:1.7;
    overflow-x:auto;
    white-space:nowrap;
    padding-bottom:4px;
  }
  .path-list span{ color:var(--accent); }

  footer.rules{
    font-size:0.82rem;
    color:var(--fg-dim);
    line-height:1.5;
    margin:0;
  }
</style>

<div class="page">
  <header class="top">
    <h1>Cavalier<br>Solitaire</h1>
    <div class="chip" id="counter">0 / 64</div>
  </header>

  <p class="status" id="status" aria-live="polite">Touchez une case pour placer le cavalier.</p>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board">
      <div class="knight" id="knight">♞</div>
    </div>
  </div>

  <div class="controls">
    <button class="action" id="undoBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      Annuler
    </button>
    <button class="action primary" id="restartBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      Recommencer
    </button>
  </div>

  <details class="path">
    <summary>
      <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      <span id="pathLabel">Parcours (0)</span>
    </summary>
    <div class="path-list" id="pathList">—</div>
  </details>

  <footer class="rules">
    Le cavalier se déplace en L, comme aux échecs&nbsp;: deux cases dans un sens, une case perpendiculairement. Visitez chaque case une seule fois et tentez de remplir tout l'échiquier.
  </footer>
</div>

<script>
(function(){
  'use strict';
  var N = 8;
  var STORAGE_KEY = 'cavalier-solitaire-state-v1';
  var FILES = 'abcdefgh';
  var KNIGHT_OFFSETS = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];

  var boardEl = document.getElementById('board');
  var boardWrapEl = document.getElementById('boardWrap');
  var knightEl = document.getElementById('knight');
  var counterEl = document.getElementById('counter');
  var statusEl = document.getElementById('status');
  var undoBtn = document.getElementById('undoBtn');
  var restartBtn = document.getElementById('restartBtn');
  var pathListEl = document.getElementById('pathList');
  var pathLabelEl = document.getElementById('pathLabel');

  var squareEls = [];
  var state = null;

  function idx(r,c){ return r*N+c; }
  function squareName(r,c){ return FILES[c] + (N-r); }

  function freshState(){
    return { board:new Array(N*N).fill(0), history:[], knight:null, phase:'idle' };
  }

  function sanitize(d){
    return {
      board: d.board.slice(0, N*N),
      history: Array.isArray(d.history) ? d.history.slice() : [],
      knight: d.knight ? { r:d.knight.r, c:d.knight.c } : null,
      phase: d.phase || 'idle'
    };
  }

  function loadFromStorageOrFresh(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(Array.isArray(parsed.board) && parsed.board.length === N*N) return sanitize(parsed);
      }
    }catch(e){}
    return freshState();
  }

  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function getSnapshot(){ return state; }

  function legalMovesFrom(r,c,board){
    var out = [];
    for(var i=0;i<KNIGHT_OFFSETS.length;i++){
      var nr = r+KNIGHT_OFFSETS[i][0], nc = c+KNIGHT_OFFSETS[i][1];
      if(nr>=0 && nr<N && nc>=0 && nc<N && board[idx(nr,nc)]===0) out.push([nr,nc]);
    }
    return out;
  }

  function computePhase(){
    if(state.history.length === N*N) return 'won';
    var legal = legalMovesFrom(state.knight.r, state.knight.c, state.board);
    return legal.length ? 'playing' : 'stuck';
  }

  function buildBoard(){
    for(var r=0;r<N;r++){
      for(var c=0;c<N;c++){
        var sq = document.createElement('div');
        sq.className = 'sq ' + (((r+c)%2===0) ? 'light' : 'dark');
        sq.dataset.r = r;
        sq.dataset.c = c;
        sq.setAttribute('role','button');
        sq.setAttribute('tabindex','0');

        var order = document.createElement('span');
        order.className = 'order';
        sq.appendChild(order);

        if(c===0){
          var rank = document.createElement('span');
          rank.className = 'rank';
          rank.textContent = String(N-r);
          sq.appendChild(rank);
        }
        if(r===N-1){
          var file = document.createElement('span');
          file.className = 'file';
          file.textContent = FILES[c];
          sq.appendChild(file);
        }

        boardEl.appendChild(sq);
        squareEls[idx(r,c)] = sq;
      }
    }
  }

  function positionKnightTo(r,c){
    var target = squareEls[idx(r,c)];
    knightEl.style.left = target.offsetLeft + 'px';
    knightEl.style.top = target.offsetTop + 'px';
    knightEl.style.width = target.offsetWidth + 'px';
    knightEl.style.height = target.offsetHeight + 'px';
  }

  function bounceKnight(){
    knightEl.classList.remove('landed');
    void knightEl.offsetWidth;
    knightEl.classList.add('landed');
  }

  function flashInvalid(i){
    var el = squareEls[i];
    el.classList.remove('invalid');
    void el.offsetWidth;
    el.classList.add('invalid');
  }

  function afterChange(bounce){
    render();
    persist();
    if(bounce) bounceKnight();
  }

  function placeKnight(r,c){
    state.board = new Array(N*N).fill(0);
    state.board[idx(r,c)] = 1;
    state.knight = {r:r,c:c};
    state.history = [{r:r,c:c}];
    state.phase = computePhase();
    afterChange(true);
  }

  function moveKnight(r,c){
    var order = state.history.length+1;
    state.board[idx(r,c)] = order;
    state.knight = {r:r,c:c};
    state.history.push({r:r,c:c});
    state.phase = computePhase();
    afterChange(true);
  }

  function undo(){
    if(state.history.length===0) return;
    var last = state.history.pop();
    state.board[idx(last.r,last.c)] = 0;
    if(state.history.length===0){
      state.knight = null;
      state.phase = 'idle';
    } else {
      var prev = state.history[state.history.length-1];
      state.knight = {r:prev.r,c:prev.c};
      state.phase = computePhase();
    }
    afterChange(false);
  }

  function restart(){
    state = freshState();
    afterChange(false);
  }

  function onSquareClick(r,c){
    if(state.phase === 'won') return;
    var i = idx(r,c);
    if(state.phase === 'idle'){
      placeKnight(r,c);
      return;
    }
    var legal = legalMovesFrom(state.knight.r, state.knight.c, state.board);
    var isLegal = legal.some(function(m){ return m[0]===r && m[1]===c; });
    if(isLegal && state.board[i]===0){
      moveKnight(r,c);
    } else {
      flashInvalid(i);
    }
  }

  function attachEvents(){
    boardEl.addEventListener('click', function(e){
      var sq = e.target.closest('.sq');
      if(!sq) return;
      onSquareClick(+sq.dataset.r, +sq.dataset.c);
    });
    boardEl.addEventListener('keydown', function(e){
      if(e.key !== 'Enter' && e.key !== ' ') return;
      var sq = e.target.closest('.sq');
      if(!sq) return;
      e.preventDefault();
      onSquareClick(+sq.dataset.r, +sq.dataset.c);
    });
    undoBtn.addEventListener('click', undo);
    restartBtn.addEventListener('click', restart);
    window.addEventListener('resize', function(){
      if(state && state.knight) positionKnightTo(state.knight.r, state.knight.c);
    });
  }

  function render(){
    var total = N*N;
    var visited = state.history.length;
    counterEl.textContent = visited + ' / ' + total;

    var legalSet = null;
    if(state.phase === 'playing' && state.knight){
      legalSet = {};
      legalMovesFrom(state.knight.r, state.knight.c, state.board).forEach(function(m){
        legalSet[idx(m[0],m[1])] = true;
      });
    }

    for(var r=0;r<N;r++){
      for(var c=0;c<N;c++){
        var i = idx(r,c);
        var el = squareEls[i];
        var v = state.board[i];
        var orderSpan = el.querySelector('.order');

        if(v>0){
          var alpha = 0.18 + 0.6 * (v / Math.max(visited,1));
          el.style.background = 'rgba(' + getComputedStyleAccent() + ',' + alpha.toFixed(3) + ')';
          orderSpan.textContent = v;
        } else {
          el.style.background = '';
          orderSpan.textContent = '';
        }

        var isLegal = !!(legalSet && legalSet[i]);
        var isCurrent = !!(state.knight && state.knight.r===r && state.knight.c===c);
        el.classList.toggle('legal', isLegal);
        el.classList.toggle('current', isCurrent);

        var label = squareName(r,c);
        if(v>0) label += ', visitée, coup ' + v;
        else if(isLegal) label += ', coup possible';
        el.setAttribute('aria-label', label);
      }
    }

    if(state.knight){
      knightEl.classList.add('placed');
      positionKnightTo(state.knight.r, state.knight.c);
    } else {
      knightEl.classList.remove('placed');
    }

    boardWrapEl.classList.toggle('won', state.phase==='won');
    statusEl.classList.toggle('won', state.phase==='won');
    statusEl.classList.toggle('stuck', state.phase==='stuck');
    statusEl.textContent =
      state.phase==='idle' ? 'Touchez une case pour placer le cavalier.' :
      state.phase==='playing' ? '' :
      state.phase==='stuck' ? 'Plus aucun coup possible. Annulez ou recommencez.' :
      'Parcours complet ! Les 64 cases sont visitées.';

    undoBtn.disabled = state.history.length===0;

    var names = state.history.map(function(h){ return squareName(h.r,h.c); });
    pathLabelEl.textContent = 'Parcours (' + names.length + ')';
    if(names.length===0){
      pathListEl.textContent = '—';
    } else {
      var head = names.slice(0,-1).join(' → ');
      var tail = names[names.length-1];
      pathListEl.innerHTML = (head ? head + ' → ' : '') + '<span>' + tail + '</span>';
    }
  }

  function getComputedStyleAccent(){ return '79,143,230'; }

  function start(initialData){
    state = (initialData && Array.isArray(initialData.board) && initialData.board.length===N*N)
      ? sanitize(initialData)
      : loadFromStorageOrFresh();
    buildBoard();
    attachEvents();
    render();
  }

  if(window.claude && window.claude.hot && window.claude.hot.snapshot){
    window.claude.hot.snapshot(getSnapshot);
  }
  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  } else {
    start((window.claude && window.claude.hot && window.claude.hot.data) || {});
  }
})();
</script>

</body></html>
